<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Forgot Password — Computer and Robotics Bursary Portal</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-portal="student" data-page="forgot-password" data-public="true" data-subtitle="Reset your portal password">

<div class="letterhead">
  <h1>Computer and Robotics Bursary Portal</h1>
  <p>Reset your portal password</p>
  <hr>
</div>

<div class="wrap">
  <div class="panel">
    <h2 style="font-size:1.2rem;">Forgot password?</h2>
    <p class="muted">Enter the email address linked to your account. If it matches, we’ll email you a reset link valid for 30 minutes.</p>
    <form id="forgot-password-form">
      <label for="portal">Portal</label>
      <select id="portal" required>
        <option value="student">Student</option>
        <option value="staff">Staff</option>
        <option value="admin">Admin</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">

      <button type="submit" id="submit-btn">Send reset link</button>
      <div class="error" id="error-msg" style="display:none;"></div>
      <div class="notice" id="notice-msg" style="display:none;"></div>
    </form>
    <p class="footer-link"><a id="back-to-login" href="/student/login.html">Back to log in</a></p>
  </div>
</div>

<script src="/js/forgot-password.js"></script>
</body>
</html>
