<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset Password — Computer and Robotics Bursary Portal</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-portal="student" data-page="reset-password" data-public="true" data-subtitle="Choose a new password">

<div class="letterhead">
  <h1>Computer and Robotics Bursary Portal</h1>
  <p>Choose a new password</p>
  <hr>
</div>

<div class="wrap">
  <div class="panel">
    <h2 style="font-size:1.2rem;">Reset password</h2>
    <form id="reset-password-form">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" required autocomplete="new-password">
      <p class="muted">At least 8 characters, including an uppercase letter, a number, and a symbol.</p>

      <label for="confirm-password">Confirm new password</label>
      <input type="password" id="confirm-password" required autocomplete="new-password">

      <button type="submit" id="submit-btn">Save new password</button>
      <div class="error" id="error-msg" style="display:none;"></div>
      <div class="notice" id="notice-msg" style="display:none;"></div>
    </form>
    <p class="footer-link"><a id="back-to-login" href="/student/login.html">Back to log in</a></p>
  </div>
</div>

<script src="/js/reset-password.js"></script>
</body>
</html>
