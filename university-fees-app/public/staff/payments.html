<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments — Staff Portal</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-portal="staff" data-page="payments">

<div id="shell"></div>

<div class="wrap">
  <div class="panel">
    <h2 style="font-size:1.2rem;">Payments</h2>
    <div class="toolbar">
      <div>
        <label for="search">Search by student, matric number or reference</label>
        <input type="text" id="search" placeholder="Start typing…">
      </div>
      <div>
        <label for="status">Status</label>
        <select id="status">
          <option value="">All</option>
          <option value="success">Successful</option>
          <option value="pending">Pending</option>
          <option value="failed">Failed</option>
        </select>
      </div>
    </div>
    <div class="table-scroll"><table class="history">
      <thead><tr><th>Date</th><th>Student</th><th>Matric no.</th><th>Type</th><th>Amount</th><th>Status</th><th>Reference</th></tr></thead>
      <tbody id="payments-body"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
    </table></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/payments.js"></script>
</body>
</html>
