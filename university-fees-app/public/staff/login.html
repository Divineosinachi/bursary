<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login — Computer and Robotics Bursary Portal</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-portal="staff" data-page="login" data-public="true" data-subtitle="Staff access">

<div id="shell"></div>

<div class="wrap">
  <div class="panel">
    <h2 style="font-size:1.2rem;">Staff log in</h2>
    <form id="login-form">
      <label for="login-identifier">Email</label>
      <input type="email" id="login-identifier" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <p class="footer-link"><a href="/forgot-password.html?portal=staff">Forgot your password?</a></p>
      <button type="submit" id="submit-btn">Log in</button>
      <div class="error" id="error-msg" style="display:none;"></div>
    </form>
    <p class="footer-link">Staff accounts are created by an administrator.</p>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
