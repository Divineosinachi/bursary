<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log — Admin Portal</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-portal="admin" data-page="audit">

<div id="shell"></div>

<div class="wrap">
  <div class="panel">
    <h2 style="font-size:1.2rem;">Audit log</h2>
    <p class="muted">The 200 most recent actions in the staff and admin portals.</p>
    <div class="table-scroll"><table class="history">
      <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead>
      <tbody id="audit-body"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
    </table></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin-audit.js"></script>
</body>
</html>
