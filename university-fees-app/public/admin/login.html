<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Computer and Robotics Bursary Portal</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-portal="admin" data-page="login" data-public="true" data-subtitle="Administrator access">

<div id="shell"></div>

<div class="wrap">
  <div class="panel">
    <h2 style="font-size:1.2rem;">Admin log in</h2>
    <form id="login-form">
      <label for="login-identifier">Email</label>
      <input type="email" id="login-identifier" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <p class="footer-link"><a href="/forgot-password.html?portal=admin">Forgot your password?</a></p>
      <button type="submit" id="submit-btn">Log in</button>
      <div class="error" id="error-msg" style="display:none;"></div>
    </form>
    
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
